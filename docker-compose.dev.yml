services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carteazilei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carteazilei_dev}
      POSTGRES_DB: ${POSTGRES_DB:-carteazilei}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - carteazilei_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carteazilei_postgres_data:

